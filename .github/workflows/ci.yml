name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gates — a PR cannot merge if any of these fail.
      - name: Lint (file size, dead imports, cycles, react-hooks)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (web + server)
        run: npm run build

      # Non-blocking for now: the web typecheck surfaces ~45 pre-existing type
      # errors (see AGENTS.md). Flip `continue-on-error` to false once cleared.
      - name: Typecheck (web)
        run: npm run typecheck
        continue-on-error: true
